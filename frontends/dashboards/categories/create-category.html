<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear categoría | Farmagest Vital</title>
    <link rel="stylesheet" href="../css/dashboard-general.css" />
    <link rel="stylesheet" href="../css/products-admin.css" />
    <link rel="stylesheet" href="../css/categories-admin.css" />
  </head>
  <body data-page="create-category">
    <header>
      <nav>
        <input type="search" placeholder="Buscar categorías..." />
        <div>
          <img src="../../imgs/admin.img" alt="Administrador" />
        </div>
      </nav>
    </header>

    <main>
      <div>
        <div>
          <img src="../../imgs/logo.png" alt="Farmagest Vital" />
        </div>
        <aside>
          <div>
            <ul>
              <li><a href="../dashboardAdmin.html">Dashboard</a></li>
              <li><a href="../products/products.html">Productos</a></li>
              <li><a href="./categories.html">Categorías</a></li>
              <li><a href="#" aria-disabled="true">Ventas</a></li>
              <li><a href="#" aria-disabled="true">Inventario</a></li>
              <li><a href="#" aria-disabled="true">Stock</a></li>
            </ul>
          </div>
          <div>
            <ul>
              <li><a href="#" aria-disabled="true">Clientes</a></li>
              <li><a href="#" aria-disabled="true">Reportes</a></li>
              <li><a href="#" aria-disabled="true">Configuración</a></li>
            </ul>
          </div>
        </aside>
      </div>

      <section class="admin-page-header">
        <div>
          <span>Categorías</span>
          <h1>Crear categoría</h1>
          <p>Define una nueva clasificación para el catálogo de productos.</p>
        </div>
        <a class="secondary-action" href="./categories.html">Volver al listado</a>
      </section>

      <section class="product-form-card category-form-card">
        <div id="adminMessage" class="admin-message" aria-live="polite"></div>
        <form id="categoryForm">
          <div class="form-grid">
            <div>
              <label for="name">Nombre de la categoría</label>
              <input
                id="name"
                name="name"
                type="text"
                required
                placeholder="Vitaminas y suplementos"
              />
            </div>
            <div class="form-full">
              <label for="description">Descripción</label>
              <textarea
                id="description"
                name="description"
                rows="4"
                placeholder="Productos orientados a suplementación y bienestar general"
              ></textarea>
            </div>
          </div>
          <div class="form-actions">
            <a class="secondary-action" href="./categories.html">Cancelar</a>
            <button type="submit">Guardar categoría</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="../../js/admin-categories.js"></script>
  </body>
</html>
