<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear categoría | Farmagest Vital</title>
    <link rel="stylesheet" href="../css/dashboard-general.css" />
    <link rel="stylesheet" href="../css/products-admin.css" />
    <link rel="stylesheet" href="../css/categories-admin.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body data-page="create-category" data-theme="light">
    <header>
      <nav>
        <input type="search" placeholder="Buscar categorías..." />
        <div>
        </div>
      </nav>
    </header>

    <main>
      <div>
        <div>
          <img src="../../imgs/logo.png" alt="logo de Farmagest Vital" />
        </div>
        <aside>
          <div>
            <ul>
              <li><a href="../dashboardAdmin.html"><i class="fa-solid fa-chart-line" aria-hidden="true"></i>Dashboard</a></li>
              <li><a href="../products/products.html"><i class="fa-solid fa-boxes-stacked" aria-hidden="true"></i>Productos</a></li>
              <li><a href="./categories.html"><i class="fa-solid fa-layer-group" aria-hidden="true"></i>Categorías</a></li>
              <li><a href="../sales/sales.html"><i class="fa-solid fa-receipt" aria-hidden="true"></i>Ventas</a></li>
              <li><span class="nav-disabled"><i class="fa-solid fa-warehouse" aria-hidden="true"></i>Inventario</span></li>
              <li><span class="nav-disabled"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>Stock</span></li>
            </ul>
          </div>
          <div>
            <ul>
              <li><span class="nav-disabled"><i class="fa-solid fa-users" aria-hidden="true"></i>Clientes</span></li>
              <li><span class="nav-disabled"><i class="fa-solid fa-file-lines" aria-hidden="true"></i>Reportes</span></li>
              <li><span class="nav-disabled"><i class="fa-solid fa-gear" aria-hidden="true"></i>Configuración</span></li>
            </ul>
          </div>
        </aside>
      </div>

      <section class="admin-page-header">
        <div>
          <span>Categorías</span>
          <h1>Crear categoría</h1>
          <p>Define una nueva clasificación para el catálogo de productos.</p>
        </div>
        <a class="secondary-action" href="./categories.html">Volver al listado</a>
      </section>

      <section class="product-form-card category-form-card">
        <div id="adminMessage" class="admin-message" aria-live="polite"></div>
        <form id="categoryForm">
          <div class="form-grid">
            <div>
              <label for="name">Nombre de la categoría</label>
              <input
                id="name"
                name="name"
                type="text"
                required
                placeholder="Vitaminas y suplementos"
              />
            </div>
            <div class="form-full">
              <label for="description">Descripción</label>
              <textarea
                id="description"
                name="description"
                rows="4"
                placeholder="Productos orientados a suplementación y bienestar general"
              ></textarea>
            </div>
          </div>
          <div class="form-actions">
            <a class="secondary-action" href="./categories.html">Cancelar</a>
            <button type="submit">Guardar categoría</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="../../js/admin-categories.js"></script>
  </body>
</html>
