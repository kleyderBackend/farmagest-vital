<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguimiento de compra | Farmagest Vital</title>
    <link rel="stylesheet" href="../css/style.css?v=1" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <a href="../index.html#inicio">
          <img src="../imgs/logo.png" alt="Logo de Farmagest Vital" />
        </a>
        <ul>
          <li><a href="../index.html#inicio">Inicio</a></li>
          <li><a href="../index.html#productos">Productos</a></li>
          <li>
            <a class="cart-nav-link" href="./carrito.html">
              <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
              <span>Carrito</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="tracking-page" aria-labelledby="trackingTitle">
        <div>
          <p>Seguimiento</p>
          <h1 id="trackingTitle">Consulta el estado de tu compra</h1>
          <span>
            Ingresa el número de pedido que recibiste al finalizar la compra
            para revisar su estado, productos y valor total.
          </span>
        </div>

        <form class="tracking-card" id="trackingForm">
          <label for="trackingCode">Número de pedido</label>
          <div>
            <input
              id="trackingCode"
              name="trackingCode"
              type="text"
              placeholder="Ej: FV-000123"
              autocomplete="off"
              required
            />
            <button type="submit" id="trackingButton">Consultar</button>
          </div>
          <small>También puedes escribir solo el número, por ejemplo 123.</small>
          <p class="tracking-message" id="trackingMessage" hidden></p>
        </form>

        <section
          class="tracking-result"
          id="trackingResult"
          aria-live="polite"
          hidden
        ></section>
      </section>
    </main>
    <script type="module" src="../js/orders.js"></script>
  </body>
</html>
